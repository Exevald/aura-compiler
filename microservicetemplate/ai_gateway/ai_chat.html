<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stasis AI Chat</title>
    <style>
        :root {
            --bg-color: #121212;
            --chat-bg: #1e1e1e;
            --primary: #10a37f;
            --primary-hover: #0d8c6d;
            --text-main: #ececec;
            --text-muted: #8e8e8e;
            --msg-user: #2b2b2b;
            --msg-ai: #1e1e1e;
            --border: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        .chat-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 15px;
            line-height: 1.6;
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .message.user {
            background-color: var(--msg-user);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            background-color: var(--msg-ai);
            align-self: flex-start;
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user .avatar {
            background-color: #555;
        }

        .ai .avatar {
            background-color: var(--primary);
            color: white;
        }

        .typing-indicator {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
            display: none; /* Скрыто по умолчанию */
            padding: 0 20px;
        }

        .chat-input-wrapper {
            padding: 20px;
            border-top: 1px solid var(--border);
            background-color: var(--chat-bg);
        }

        .chat-input-box {
            display: flex;
            gap: 10px;
            background-color: #2b2b2b;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .chat-input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            padding: 5px 10px;
            outline: none;
        }

        .chat-input-box button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-input-box button:hover {
            background-color: var(--primary-hover);
        }

        .chat-input-box button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* Ползунок температуры (спрятан, но его значение передается) */
        input[type="hidden"] {
            display: none;
        }

        .markdown-body {
            width: 100%;
        }
        .markdown-body p { margin: 0 0 10px 0; }
        .markdown-body p:last-child { margin: 0; }
        .markdown-body pre {
            background: #0d0d0d;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid #333;
        }
        .markdown-body code {
            background: #2b2b2b;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: Consolas, Monaco, monospace;
            font-size: 0.9em;
            color: #ff9e64;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            color: #e0af68;
        }
        .markdown-body ul, .markdown-body ol {
            margin: 0 0 10px 0;
            padding-left: 20px;
        }
        .markdown-body a { color: var(--primary); text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }
    </style>
    <script src="./marked.min.js"></script>
    <script src="./purify.min.js"></script>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Stasis AI Powered Chat</div>

    <div class="chat-messages" id="chatWindow">
        <div class="message ai">
            <div class="avatar">AI</div>
            <div class="content">Привет! Я подключен к бэкенду на языке Stasis. Что бы ты хотел узнать?</div>
        </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">ИИ думает...</div>

    <div class="chat-input-wrapper">
        <div class="chat-input-box">
            <input type="text" id="promptInput" placeholder="Напиши сообщение..." autocomplete="off">
            <input type="hidden" id="tempInput" value="0.0">
            <button id="sendBtn">Отправить</button>
        </div>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chatWindow');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const tempInput = document.getElementById('tempInput');

    function addMessage(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? 'ME' : 'AI';

        const content = document.createElement('div');
        content.className = 'content markdown-body';

        const rawHtml = marked.parse(text);
        const cleanHtml = DOMPurify.sanitize(rawHtml);

        content.innerHTML = cleanHtml;

        msgDiv.appendChild(avatar);
        msgDiv.appendChild(content);
        chatWindow.appendChild(msgDiv);

        // Прокрутка вниз
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendMessage() {
        const text = promptInput.value.trim();
        if (!text) return;

        promptInput.value = '';
        promptInput.disabled = true;
        sendBtn.disabled = true;
        typingIndicator.style.display = 'block';

        addMessage('user', text);

        try {
            const response = await fetch('http://localhost:8080/api/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    prompt: text,
                    temperature: tempInput.value
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            const aiText = data.response || "Пустой ответ от сервера";
            addMessage('ai', aiText);

        } catch (error) {
            console.error('Ошибка:', error);
            addMessage('ai', 'Произошла ошибка при связи с сервером. Проверь CORS или запущена ли ВМ.');
        } finally {
            promptInput.disabled = false;
            sendBtn.disabled = false;
            typingIndicator.style.display = 'none';
            promptInput.focus();
        }
    }

    async function loadHistory() {
        try {
            const response = await fetch('http://localhost:8080/api/history');

            if (!response.ok) {
                throw new Error('Failed to fetch history');
            }

            const data = await response.json();

            if (data.messages && data.messages.length > 0) {
                chatWindow.innerHTML = '';

                data.messages.forEach(msg => {
                    const roleClass = msg.role === 'assistant'
                        ? 'ai'
                        : 'user';
                    addMessage(roleClass, msg.content);
                });
            }
        } catch (error) {
            console.error('Ошибка загрузки истории:', error);
        }
    }

    window.addEventListener('DOMContentLoaded', loadHistory);

    sendBtn.addEventListener('click', sendMessage);
    promptInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>

</body>
</html>
