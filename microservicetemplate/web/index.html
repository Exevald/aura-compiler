<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Pipeline</title>
  <link rel="stylesheet" href="/styles.css" />
  <script defer src="/app.js"></script>
</head>
<body data-task-api-base="http://127.0.0.1:8082">
  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Task tracker</p>
        <h1>Pipeline board</h1>
      </div>
      <div class="hero-actions">
        <button class="ghost" id="refreshBtn">Refresh</button>
        <button class="primary" id="demoTokenBtn">Use demo token</button>
      </div>
    </header>

    <section class="panel flow-strip">
      <div class="flow-stat">
        <span>Todo</span>
        <strong id="countTodo">0</strong>
      </div>
      <div class="flow-stat">
        <span>In progress</span>
        <strong id="countInProgress">0</strong>
      </div>
      <div class="flow-stat">
        <span>Resolved</span>
        <strong id="countResolved">0</strong>
      </div>
      <div class="flow-stat flow-total">
        <span>Total</span>
        <strong id="countTotal">0</strong>
      </div>
      <div class="flow-stat">
        <span>Archived</span>
        <strong id="countArchived">0</strong>
      </div>
    </section>

    <section class="panel board-toolbar">
      <div class="board-toolbar-main">
        <label class="field compact">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="title, description, tags" />
        </label>
        <label class="field compact">
          <span>Priority</span>
          <select id="priorityFilterInput">
            <option value="">All priorities</option>
            <option value="urgent">urgent</option>
            <option value="high">high</option>
            <option value="normal">normal</option>
            <option value="low">low</option>
          </select>
        </label>
        <label class="field compact">
          <span>Tag</span>
          <input id="tagFilterInput" type="text" placeholder="frontend, api, docs" />
        </label>
        <label class="field compact inline">
          <input id="showArchivedInput" type="checkbox" />
          <span>Show archived</span>
        </label>
      </div>
      <div class="board-toolbar-actions">
        <button id="clearFiltersBtn" class="ghost">Clear filters</button>
      </div>
    </section>

    <main class="layout">
      <section class="panel archive-panel" id="archivePanel">
        <div class="panel-head">
          <strong>Archive</strong>
          <span class="muted" id="archiveCount">0 tasks</span>
        </div>
        <div class="panel-body">
          <div class="archive-lane" id="archiveLane"></div>
        </div>
      </section>

      <section class="panel pipeline-panel">
        <div class="panel-head">
          <strong>Pipeline</strong>
          <span class="muted">Cards move left to right as status changes.</span>
        </div>
        <div class="panel-body">
          <div class="pipeline" id="pipeline"></div>
        </div>
      </section>

      <aside class="sidebar">
        <section class="panel">
          <div class="panel-head">
            <strong id="formTitle">Create task</strong>
            <span class="muted" id="authState">No token</span>
          </div>
          <div class="panel-body">
            <label class="field">
              <span>JWT token</span>
              <textarea id="tokenInput" placeholder="Paste token or press Use demo token"></textarea>
            </label>
            <div class="row">
              <button id="saveTokenBtn">Save token</button>
              <button id="clearTokenBtn" class="danger">Clear token</button>
            </div>

            <hr class="divider" />

            <label class="field">
              <span>Title</span>
              <input id="titleInput" type="text" placeholder="Ship onboarding checklist" />
            </label>
            <label class="field">
              <span>Description</span>
              <textarea id="descriptionInput" placeholder="What needs to be done"></textarea>
            </label>
            <label class="field">
              <span>Status</span>
              <select id="statusInput">
                <option value="todo">todo</option>
                <option value="in_progress">in_progress</option>
                <option value="resolved">resolved</option>
              </select>
            </label>
            <div class="grid-2">
              <label class="field">
                <span>Priority</span>
                <select id="priorityInput">
                  <option value="normal">normal</option>
                  <option value="low">low</option>
                  <option value="high">high</option>
                  <option value="urgent">urgent</option>
                </select>
              </label>
              <label class="field">
                <span>Due date</span>
                <input id="dueDateInput" type="date" />
              </label>
            </div>
            <label class="field">
              <span>Tags</span>
              <input id="tagsInput" type="text" placeholder="frontend, api, docs" />
            </label>
            <label class="field">
              <span>Checklist</span>
              <textarea id="checklistInput" placeholder="One item per line"></textarea>
            </label>
            <label class="field inline">
              <input id="archivedInput" type="checkbox" />
              <span>Archived</span>
            </label>

            <div class="row">
              <button class="primary" id="submitTaskBtn">Create</button>
              <button id="resetFormBtn">Reset</button>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <strong>AI actions</strong>
          </div>
          <div class="panel-body stack">
            <div class="row">
              <button class="good" id="highlightBtn">Highlight important</button>
              <button class="good" id="summaryBtn">Summarize</button>
            </div>
            <div>
              <div class="label">Summary</div>
              <div class="result" id="summaryResult">No summary yet.</div>
            </div>
            <div>
              <div class="label">Highlights</div>
              <div class="result" id="highlightResult">No AI highlight yet.</div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <strong>Activity</strong>
            <span class="muted" id="statusText">Idle</span>
          </div>
          <div class="panel-body">
            <div class="result log" id="logArea">Ready.</div>
          </div>
        </section>
      </aside>
    </main>
  </div>
</body>
</html>
