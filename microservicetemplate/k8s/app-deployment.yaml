apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservicetemplate-app
  namespace: aura-microservicetemplate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservicetemplate-app
  template:
    metadata:
      labels:
        app: microservicetemplate-app
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: your-registry/microservicetemplate:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app/microservicetemplate
          command:
            - /app/aura-compiler
            - run
            - /app/microservicetemplate/cmd/main.aura
          ports:
            - containerPort: 8082
              name: http
          envFrom:
            - configMapRef:
                name: microservicetemplate-app-config
            - secretRef:
                name: microservicetemplate-app-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
